<!DOCTYPE html>
<!-- build:shell-v1 -->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="VBH Hub"/>
<meta name="theme-color" content="#1B3564"/>
<title>Operations Hub · VBH Ops Hub</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-hub-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<script src="/vbh-config.js"></script>
<link rel="stylesheet" href="/assets/vbh.css">
<script src="/assets/vbh-shell.js"></script>
<style>
/* The hub is the one dark page: the landing screen, not a work surface. */
html, body { min-height: 100%; }
body {
  color: #fff;
  background:
    radial-gradient(1400px 900px at 15% -10%, rgba(107,142,181,0.22), transparent 60%),
    radial-gradient(1000px 800px at 110% 110%, rgba(201,168,76,0.10), transparent 50%),
    linear-gradient(160deg, var(--navy-deep) 0%, var(--navy-dark) 60%, var(--navy) 100%);
  display: flex; flex-direction: column;
}
.vbh-nav { border-bottom-color: rgba(255,255,255,0.14); }

#hub { flex: 1; display: flex; flex-direction: column; padding: 44px 28px 24px; }

.hub-header { text-align: center; margin-bottom: 36px; }
.hub-logo { height: 84px; object-fit: contain; filter: brightness(0) invert(1); opacity: .96; margin-bottom: 18px; }
.hub-header h1 { font-family: var(--font-head); font-size: 44px; font-weight: 600; color: #fff; letter-spacing: .03em; line-height: 1; margin: 0; }
.hub-header .accent { width: 80px; height: 2px; background: var(--gold); border-radius: 2px; margin: 14px auto 12px; }
.hub-header .sub { font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: var(--mid); font-weight: 700; }

.hub-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 340px));
  gap: 22px; justify-content: center;
  max-width: 1180px; margin: 0 auto; width: 100%;
}
.hub-card {
  display: flex; flex-direction: column; gap: 14px;
  text-decoration: none; color: inherit;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: var(--radius-lg);
  padding: 26px 26px 22px;
  transition: transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s;
  position: relative; overflow: hidden;
}
.hub-card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent, var(--steel)); transition: height .15s; }
.hub-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.28); box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.hub-card:hover::before { height: 5px; }
.hub-icon {
  width: 58px; height: 58px; border-radius: 14px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 28px; color: #fff; background: var(--accent, var(--steel));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
}
.hub-card h3 { margin: 0; font-family: var(--font-head); font-size: 25px; font-weight: 700; color: #fff; letter-spacing: .02em; line-height: 1.15; }
.hub-card p { margin: 0; font-size: 13.5px; color: var(--mid); line-height: 1.5; font-weight: 300; }
.hub-card .open-cta {
  margin-top: auto; padding-top: 14px;
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-soft);
  border-top: 1px solid rgba(255,255,255,0.12);
}
.hub-card .open-cta::after { content: '→'; font-size: 14px; transition: transform .15s; }
.hub-card:hover .open-cta::after { transform: translateX(4px); }

/* accent palette keyed by PAGES[].tile.accent */
.hub-card[data-accent="steel"]     { --accent: linear-gradient(160deg, var(--steel) 0%, #4a6e9a 100%); }
.hub-card[data-accent="gold"]      { --accent: linear-gradient(160deg, var(--gold) 0%, var(--amber-dk) 100%); }
.hub-card[data-accent="blue"]      { --accent: linear-gradient(160deg, var(--blue) 0%, var(--blue-dk) 100%); }
.hub-card[data-accent="green"]     { --accent: linear-gradient(160deg, var(--green) 0%, var(--green-dk) 100%); }
.hub-card[data-accent="amber"]     { --accent: linear-gradient(160deg, var(--amber) 0%, var(--amber-dk) 100%); }
.hub-card[data-accent="purple"]    { --accent: linear-gradient(160deg, var(--purple) 0%, var(--purple-dk) 100%); }
.hub-card[data-accent="navy"]      { --accent: linear-gradient(160deg, var(--navy) 0%, var(--steel) 100%); }
.hub-card[data-accent="navy-gold"] { --accent: linear-gradient(160deg, var(--navy) 0%, var(--gold) 100%); }

/* dark footer variant for this page */
.vbh-foot { border-top-color: rgba(255,255,255,0.14); color: var(--mid); margin-top: 36px; }
.vbh-foot .vbh-foot-values { color: var(--gold-soft); }
.vbh-foot a { color: var(--mid); } .vbh-foot a:hover { color: #fff; }
.vbh-foot .vbh-foot-build { color: rgba(255,255,255,0.35); }

@media (max-width: 900px) {
  #hub { padding: 32px 18px 18px; }
  .hub-header h1 { font-size: 34px; }
}
</style>
</head>
<body data-vbh-page="hub" data-vbh-build="hub-v2">

<div id="hub">
  <div class="hub-header">
    <img class="hub-logo" src="/img/vbh-logo.png" alt="Van Buskirk Homes"/>
    <h1>Operations Hub</h1>
    <div class="accent"></div>
    <div class="sub">Van Buskirk Homes · Sioux Falls, SD</div>
  </div>

  <!-- Tiles render from VBH.PAGES (entries with a `tile`). Add a page there and it shows up here. -->
  <div class="hub-cards" data-vbh-tiles></div>
</div>

<div data-vbh-foot></div>
</body>
</html>
