<!DOCTYPE html>
<!-- build:shell-v1 -->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="VBH Gantt"/>
<meta name="theme-color" content="#1B3564"/>
<title>Build Timeline · VBH Ops Hub</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-hub-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/vbh-config.js"></script>
<link rel="stylesheet" href="/assets/vbh.css">
<script src="/assets/vbh-shell.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; }
:root {
  --row-h: 38px;
  --label-w: 240px;
}


/* ---------- controls ---------- */
.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
  padding: 16px 22px; background: var(--white);
  border-bottom: 1px solid var(--border);
}
.legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.legend .item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--navy-dark); font-weight: 700; }
.legend .swatch { width: 22px; height: 11px; border-radius: 3px; }
.sw-solds { background: linear-gradient(90deg, #4ade80 0%, var(--green-dk) 100%); }
.sw-model { background: linear-gradient(90deg, #a78bfa 0%, var(--purple-dk) 100%); }
.sw-lead  { background: repeating-linear-gradient(135deg, var(--gold) 0 7px, var(--gold-soft) 7px 14px); }
.spacer { flex: 1 1 auto; }
.scale-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.scale-toggle button {
  border: 0; background: var(--white); color: var(--navy-dark);
  font: inherit; font-weight: 700; font-size: 12.5px;
  padding: 7px 14px; cursor: pointer;
}
.scale-toggle button.active { background: var(--navy); color: #fff; }

/* ---------- chart ---------- */
.wrap { padding: 18px 22px 40px; }
.chart-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
}
.scroller { overflow-x: auto; }
.gantt { position: relative; min-width: max-content; }

/* month header */
.months {
  display: flex; position: sticky; top: 0; z-index: 4;
  background: var(--light); border-bottom: 1px solid var(--border);
  margin-left: var(--label-w);
}
.month {
  border-left: 1px solid var(--border);
  font-size: 11.5px; font-weight: 700; letter-spacing: .5px;
  text-transform: uppercase; color: var(--navy-dark);
  padding: 8px 0 7px; text-align: center; flex: 0 0 auto;
}
.month .yr { display: block; font-size: 9.5px; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
.month:first-child { border-left: 0; }

/* rows */
.rows { position: relative; }
.gridlines { position: absolute; inset: 0 0 0 var(--label-w); z-index: 0; pointer-events: none; }
.gridlines .v { position: absolute; top: 0; bottom: 0; border-left: 1px solid #eef3fa; }

.grp-head {
  display: flex; align-items: center; gap: 9px;
  padding: 9px var(--label-w) 8px 16px;
  background: var(--light);
  border-top: 1px solid var(--border);
  font-size: 11.5px; font-weight: 900; letter-spacing: .9px; text-transform: uppercase;
  color: var(--navy-dark);
  position: relative; z-index: 2;
}
.grp-head .dot { width: 9px; height: 9px; border-radius: 50%; }
.grp-head .cnt { color: var(--muted); font-weight: 700; }
.dot-solds { background: var(--green); }
.dot-model { background: var(--purple); }
.dot-lead  { background: var(--gold); }

.row { display: flex; align-items: center; min-height: var(--row-h); position: relative; z-index: 1; }
.row:hover { background: #f6f9fd; }
.row .label {
  width: var(--label-w); flex: 0 0 var(--label-w);
  padding: 5px 12px 5px 16px; overflow: hidden;
  position: sticky; left: 0; z-index: 3;
  background: inherit;
}
.row:nth-child(even) { background: #fbfcfe; }
.row .job { font-size: 12.5px; font-weight: 900; color: var(--navy); line-height: 1.1; }
.row .addr { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .name { font-size: 11px; color: var(--steel); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { position: relative; flex: 1 1 auto; height: 100%; }

.bar {
  position: absolute; top: 50%; transform: translateY(-50%);
  height: 18px; border-radius: 5px;
  display: flex; align-items: center;
  box-shadow: var(--shadow-sm);
  cursor: default;
}
.bar.solds { background: linear-gradient(90deg, #4ade80 0%, var(--green-dk) 100%); }
.bar.model { background: linear-gradient(90deg, #a78bfa 0%, var(--purple-dk) 100%); }
.bar.lead  {
  background: repeating-linear-gradient(135deg, var(--gold) 0 7px, var(--gold-soft) 7px 14px);
  border: 1px dashed var(--amber-dk);
  height: 16px;
}
.bar .pct {
  font-size: 10px; font-weight: 900; color: #fff; padding-left: 7px;
  text-shadow: 0 1px 1px rgba(0,0,0,.25); white-space: nowrap;
}
.bar.lead .pct { color: var(--amber-dk); text-shadow: none; }
/* estimated-end portion (no complete_date) shown lighter */
.bar .est { position: absolute; right: 0; top: 0; bottom: 0; border-radius: 0 5px 5px 0;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 5px, transparent 5px 10px); }

.bar-cap { position: absolute; top: 50%; transform: translate(-50%,-50%);
  font-size: 10px; font-weight: 900; color: var(--navy-dark); white-space: nowrap; }

/* markers */
.today {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--red); z-index: 5; pointer-events: none;
}
.today::after {
  content: 'TODAY'; position: absolute; top: -1px; left: 4px;
  font-size: 9px; font-weight: 900; letter-spacing: 1px; color: var(--red);
  background: var(--white); padding: 1px 4px; border-radius: 3px;
  box-shadow: var(--shadow-sm);
}
.close-mark {
  position: absolute; top: 50%; transform: translate(-50%,-50%) rotate(45deg);
  width: 11px; height: 11px; background: var(--gold);
  border: 1.5px solid var(--amber-dk); z-index: 4;
}
.close-mark::after {
  content: attr(data-d); position: absolute; left: 50%; top: -22px;
  transform: translateX(-50%) rotate(-45deg);
  font-size: 9px; font-weight: 900; color: var(--amber-dk); white-space: nowrap;
}

/* states */
.state { padding: 60px 22px; text-align: center; color: var(--muted); }
.state h3 { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--navy); margin-bottom: 6px; }
.state .err { color: var(--red); font-weight: 700; }
.foot { padding: 12px 22px 0; font-size: 11.5px; color: var(--muted); }
.foot b { color: var(--navy-dark); }

@media (max-width: 640px) {
  :root { --label-w: 150px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body data-vbh-page="gantt" data-vbh-build="gantt-v2">

<div data-vbh-header></div>

<div class="controls">
  <div class="legend">
    <span class="item"><span class="swatch sw-solds"></span>Solds</span>
    <span class="item"><span class="swatch sw-model"></span>Models</span>
    <span class="item"><span class="swatch sw-lead"></span>Prospective</span>
  </div>
  <span class="spacer"></span>
  <div class="scale-toggle" id="scaleToggle">
    <button data-px="34">Compact</button>
    <button data-px="54" class="active">Standard</button>
    <button data-px="84">Wide</button>
  </div>
</div>

<div class="wrap">
  <div class="chart-card">
    <div id="content" class="scroller">
      <div class="state"><h3>Loading timeline…</h3><div>Pulling active builds and prospective starts.</div></div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ============================================================
   CONFIG — adjust if your leads table uses different names.
   The projects table is read directly from the tracker schema.
   ============================================================ */
const LEADS_TABLE      = 'leads';
const LEAD_JOB_FIELD   = 'job_number';      // job # on a lead row
const LEAD_START_FIELD = 'start_date';      // prospective start
const LEAD_ADDR_FIELD  = 'tentative_address';
const LEAD_NAME_FIELD  = 'owner1_last';     // homeowner last name on a lead row
const PROJ_NAME_FIELD  = 'buyer_realtor';   // projects store the homeowner in buyer_realtor; we derive the last name from it

const MONTHS_END_FROM_START = 7;            // bar end = start + 7 months when no complete_date
/* ============================================================ */

const SUPABASE_URL  = VBH.SUPABASE_URL;
const SUPABASE_ANON = VBH.SUPABASE_KEY;

let sb = null;
let PX_PER_MONTH = 54;

// Surface setup problems on screen instead of hanging on "Loading…"
function fail(title, detail, hint) {
  const c = document.getElementById('content');
  if (c) c.innerHTML = `<div class="state"><h3>${title}</h3>`
    + `<div class="err">${detail ? esc(detail) : ''}</div>`
    + (hint ? `<div style="margin-top:8px;max-width:520px;margin-inline:auto;line-height:1.5">${hint}</div>` : '')
    + `</div>`;
}

function initClient() {
  if (!window.supabase || !window.supabase.createClient) {
    fail('Supabase library didn’t load',
      'window.supabase is undefined.',
      'The Supabase CDN script was blocked or failed to load. Check the network tab for <b>@supabase/supabase-js</b>, and confirm the page can reach the CDN.');
    return false;
  }
  if (!SUPABASE_URL || !SUPABASE_ANON) {
    fail('Missing Supabase credentials',
      `URL: ${SUPABASE_URL ? 'ok' : 'undefined'} · key: ${SUPABASE_ANON ? 'ok' : 'undefined'}`,
      'This usually means <b>/vbh-config.js</b> didn’t load — most often because the page was opened from disk rather than served from vbchomes.net. Host it on the hub (or wherever the other tiles live) so <b>/vbh-config.js</b> resolves.');
    return false;
  }
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    return true;
  } catch (e) {
    fail('Couldn’t create Supabase client', e.message || String(e));
    return false;
  }
}

const MS_DAY = 86400000;
const fmtDay = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const parseDate = s => { if (!s) return null; const d = new Date(s + (String(s).length <= 10 ? 'T00:00:00' : '')); return isNaN(d) ? null : d; };
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// The timeline label wants just the surname. buyer_realtor now carries the
// canonical "Martin, David and Patty" (surname before the comma); legacy rows
// may still be freeform "David & Patty Martin" (surname = last token).
// Leads already carry owner1_last, so they skip this.
function lastName(full){
  const s = String(full ?? '').trim();
  if (!s) return '';
  if (s.includes(',')) return s.split(',')[0].trim();
  const parts = s.split(/\s+/);
  return parts[parts.length - 1];
}

// reject if a thenable (Supabase query builder) doesn't settle in time
function withTimeout(thenable, ms, label) {
  return Promise.race([
    Promise.resolve(thenable),
    new Promise((_, rej) => setTimeout(() => rej(new Error(`${label} timed out after ${ms/1000}s — no response from Supabase`)), ms))
  ]);
}

// derive {start, end, estimated, close, pct} for a row
function deriveBar(start, complete, closing, pct) {
  const s = parseDate(start);
  if (!s) return null;
  let end = parseDate(complete);
  let estimated = false;
  if (!end) { end = addMonths(s, MONTHS_END_FROM_START); estimated = true; }
  return { start: s, end, estimated, close: parseDate(closing), pct };
}

async function load() {
  const content = document.getElementById('content');
  let projects = [], leads = [], leadErr = null;

  try {
    const r = await withTimeout(
      sb.from('projects').select('*').in('stage', ['solds', 'model']),
      15000, 'projects query');
    if (r.error) throw r.error;
    projects = r.data || [];
  } catch (e) {
    fail('Couldn’t load projects', e.message || String(e),
      'If this timed out, the request may be blocked before it reaches Supabase — the same endpoint-security HTTPS interception that hit your laptop before. Try another network or browser to confirm.');
    return;
  }

  // leads are optional — if the table/columns differ, we degrade gracefully
  let leadCols = [];
  try {
    const r = await withTimeout(sb.from(LEADS_TABLE).select('*'), 15000, 'leads query');
    if (r.error) throw r.error;
    const rows = r.data || [];
    if (rows.length) leadCols = Object.keys(rows[0]);
    leads = rows.filter(l => l[LEAD_JOB_FIELD] && l[LEAD_START_FIELD]);
  } catch (e) { leadErr = e.message || String(e); }

  const groups = [
    { key: 'solds', title: 'Solds — Under Construction', dot: 'dot-solds', cls: 'solds',
      items: projects.filter(p => p.stage === 'solds').map(p => ({
        job: p.job_number, addr: p.address, name: lastName(p[PROJ_NAME_FIELD]),
        bar: deriveBar(p.start_date, p.complete_date, p.closing_date,
              p.pct_complete != null ? Math.round(p.pct_complete * 100) : null)
      })) },
    { key: 'model', title: 'Models — Show Homes', dot: 'dot-model', cls: 'model',
      items: projects.filter(p => p.stage === 'model').map(p => ({
        job: p.job_number, addr: p.address, name: lastName(p[PROJ_NAME_FIELD]),
        bar: deriveBar(p.start_date, p.complete_date, p.closing_date,
              p.pct_complete != null ? Math.round(p.pct_complete * 100) : null)
      })) },
    { key: 'lead', title: 'Prospective Starts', dot: 'dot-lead', cls: 'lead',
      items: leads.map(l => ({
        job: l[LEAD_JOB_FIELD], addr: l[LEAD_ADDR_FIELD], name: l[LEAD_NAME_FIELD], prob: l.probability,
        bar: deriveBar(l[LEAD_START_FIELD], l.completion_date || null, l.completion_date || null, null)
      })) },
  ].map(g => ({ ...g, items: g.items.filter(i => i.bar).sort((a,b)=> a.bar.start - b.bar.start) }))
   .filter(g => g.items.length);

  const all = groups.flatMap(g => g.items.map(i => i.bar));
  if (!all.length) {
    content.innerHTML = `<div class="state"><h3>No dated builds yet</h3><div>Add a start date to a sold, model, or prospective lead and it’ll appear here.</div></div>`;
    document.getElementById('foot').innerHTML = leadErr ? footNote(leadErr, 0, []) : '';
    return;
  }

  // timeline bounds — pad one month each side, snap to month starts
  const today = new Date(); today.setHours(0,0,0,0);
  let min = new Date(Math.min(...all.map(b => +b.start), +today));
  let max = new Date(Math.max(...all.map(b => +b.end),   +today));
  min = startOfMonth(addMonths(min, -1));
  max = startOfMonth(addMonths(max, 2));
  const totalMonths = monthsBetween(min, max);

  const xOf = d => (monthsBetween(min, d) + (d.getDate() - 1) / 31) * PX_PER_MONTH;

  // month header
  let mh = '';
  for (let i = 0; i < totalMonths; i++) {
    const m = addMonths(min, i);
    mh += `<div class="month" style="width:${PX_PER_MONTH}px">${m.toLocaleDateString('en-US',{month:'short'})}<span class="yr">${m.getFullYear()}</span></div>`;
  }

  // gridlines
  let grid = '';
  for (let i = 0; i <= totalMonths; i++) grid += `<div class="v" style="left:${i*PX_PER_MONTH}px"></div>`;

  // rows
  let rowsHtml = '';
  for (const g of groups) {
    rowsHtml += `<div class="grp-head"><span class="dot ${g.dot}"></span>${esc(g.title)} <span class="cnt">· ${g.items.length}</span></div>`;
    for (const it of g.items) {
      const b = it.bar;
      const left = xOf(b.start);
      const width = Math.max(xOf(b.end) - left, 10);
      const estPart = b.estimated ? `<span class="est" style="width:${Math.min(0.5,(MONTHS_END_FROM_START-Math.max(0,monthsBetween(b.start, new Date())))/MONTHS_END_FROM_START)*100||34}%"></span>` : '';
      const pctTxt = b.pct != null
        ? `<span class="pct">${b.pct}%</span>`
        : (g.cls==='lead' ? `<span class="pct">${it.prob ? it.prob+'%' : 'planned'}</span>` : '');
      const closeMark = b.close
        ? `<span class="close-mark" data-d="${fmtDay(b.close)}" style="left:${xOf(b.close)}px" title="Closing ${fmtDay(b.close)}"></span>` : '';
      const tip = `${it.job||''} · ${fmtDay(b.start)} → ${fmtDay(b.end)}${b.estimated?' (est.)':''}`;
      rowsHtml += `
        <div class="row">
          <div class="label">
            <div class="job">${esc(it.job || '—')}</div>
            ${it.addr ? `<div class="addr">${esc(it.addr)}</div>` : ''}
            ${it.name ? `<div class="name">${esc(it.name)}</div>` : ''}
            ${(!it.addr && !it.name) ? `<div class="addr">(no address)</div>` : ''}
          </div>
          <div class="track">
            <div class="bar ${g.cls}" style="left:${left}px;width:${width}px" title="${esc(tip)}">${pctTxt}${estPart}</div>
            ${closeMark}
          </div>
        </div>`;
    }
  }

  const trackW = totalMonths * PX_PER_MONTH;
  const todayLeft = xOf(today);

  content.innerHTML = `
    <div class="gantt" style="--label-w:240px">
      <div class="months">${mh}</div>
      <div class="rows" style="min-width:${trackW}px">
        <div class="gridlines">${grid}</div>
        <div class="today" style="left:calc(var(--label-w) + ${todayLeft}px)"></div>
        ${rowsHtml}
      </div>
    </div>`;

  document.getElementById('foot').innerHTML = footNote(leadErr, leads.length, leadCols);
}

function footNote(leadErr, leadCount, leadCols) {
  const base = `Bars run from <b>start date</b> to <b>complete date</b>. When no complete date is set, the end is estimated at <b>start + ${MONTHS_END_FROM_START} months</b> (hatched). Diamonds mark closings.`;
  if (leadErr) return base + `<br>Prospective starts not loaded: <b>${esc(leadErr)}</b>. Edit the leads config block at the top of gantt.html.`;
  if (leadCount === 0 && leadCols && leadCols.length) {
    // we read the table but matched nothing — likely wrong column names
    return base + `<br>No prospective starts matched. Your leads table columns are: <b>${esc(leadCols.join(', '))}</b>. `
      + `Set <b>LEAD_JOB_FIELD</b> / <b>LEAD_START_FIELD</b> in the config block to the right names.`;
  }
  return base + ` Showing <b>${leadCount}</b> prospective start${leadCount===1?'':'s'}.`;
}

document.getElementById('scaleToggle').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  document.querySelectorAll('#scaleToggle button').forEach(b => b.classList.toggle('active', b === btn));
  PX_PER_MONTH = +btn.dataset.px;
  if (sb) load();
});

function boot() { if (initClient()) load(); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
<div data-vbh-foot></div>
</body>
</html>
