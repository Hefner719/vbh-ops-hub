<!DOCTYPE html>
<!-- build:shell-v1 · timeline-v5 -->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="VBH Gantt"/>
<meta name="theme-color" content="#1B3564"/>
<title>Build Timeline · VBH Ops Hub</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-hub-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/vbh-config.js"></script>
<link rel="stylesheet" href="/assets/vbh.css">
<script src="/assets/vbh-shell.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; }
:root {
  --row-h: 38px;
  --label-w: 240px;
}


/* ---------- controls ---------- */
.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
  padding: 16px 22px; background: var(--white);
  border-bottom: 1px solid var(--border);
}
.legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.legend .item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--navy-dark); font-weight: 700; }
.legend .swatch { width: 22px; height: 11px; border-radius: 3px; }
.sw-solds { background: linear-gradient(90deg, #4ade80 0%, var(--green-dk) 100%); }
.sw-model { background: linear-gradient(90deg, #a78bfa 0%, var(--purple-dk) 100%); }
.sw-lead  { background: repeating-linear-gradient(135deg, var(--gold) 0 7px, var(--gold-soft) 7px 14px); }
.sw-escrow { background: linear-gradient(90deg, #38bdf8 0%, #0369a1 100%); }
.sw-precon { background: linear-gradient(90deg, #94a3b8 0%, #475569 100%); }
.sw-ph { background: repeating-linear-gradient(135deg, rgba(251,146,60,.35) 0 6px, rgba(251,146,60,.1) 6px 12px); border:1px dashed #fb923c; }
.spacer { flex: 1 1 auto; }
.scale-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.scale-toggle button {
  border: 0; background: var(--white); color: var(--navy-dark);
  font: inherit; font-weight: 700; font-size: 12.5px;
  padding: 7px 14px; cursor: pointer;
}
.scale-toggle button.active { background: var(--navy); color: #fff; }

/* ---------- chart ---------- */
.wrap { padding: 18px 22px 40px; }
.chart-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
}
.scroller { overflow-x: auto; }
.gantt { position: relative; min-width: max-content; }

/* month header */
.months {
  display: flex; position: sticky; top: 0; z-index: 4;
  background: var(--light); border-bottom: 1px solid var(--border);
  margin-left: var(--label-w);
}
.month {
  border-left: 1px solid var(--border);
  font-size: 11.5px; font-weight: 700; letter-spacing: .5px;
  text-transform: uppercase; color: var(--navy-dark);
  padding: 8px 0 7px; text-align: center; flex: 0 0 auto;
}
.month .yr { display: block; font-size: 9.5px; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
.month:first-child { border-left: 0; }

/* rows */
.rows { position: relative; }
.gridlines { position: absolute; inset: 0 0 0 var(--label-w); z-index: 0; pointer-events: none; }
.gridlines .v { position: absolute; top: 0; bottom: 0; border-left: 1px solid #eef3fa; }
/* Alternating month bands. On a plain white track it is genuinely hard to
   tell which month a bar starts or ends in; the banding gives the eye a
   column to read against. Kept very light so bars stay the loudest thing. */
.gridlines .band { position: absolute; top: 0; bottom: 0; background: #f4f8fd; }

/* The month strip repeats above every section — scrolled halfway down a long
   chart, a single header at the very top is out of sight exactly when it is
   needed. */
.months-row {
  display: flex; margin-left: var(--label-w);
  background: var(--light); border-bottom: 1px solid var(--border);
  border-top: 1px solid var(--border);
}
.months-row .month { padding: 4px 0 4px; font-size: 10.5px; color: var(--muted); }
.months-row .month .yr { font-size: 8.5px; }

.grp-head {
  display: flex; align-items: center; gap: 9px;
  padding: 9px var(--label-w) 8px 16px;
  background: var(--light);
  border-top: 1px solid var(--border);
  font-size: 11.5px; font-weight: 900; letter-spacing: .9px; text-transform: uppercase;
  color: var(--navy-dark);
  position: relative; z-index: 2;
}
.grp-head .dot { width: 9px; height: 9px; border-radius: 50%; }
.grp-head .cnt { color: var(--muted); font-weight: 700; }
.dot-solds  { background: var(--green); }
.dot-model  { background: var(--purple); }
.dot-lead   { background: var(--gold); }
.dot-escrow { background: #0ea5e9; }
.dot-precon { background: #64748b; }
.dot-ph     { background: #fb923c; }

/* ── v2 · monthly starts band ───────────────────────────────────────────
   The question this page is asked in a spec meeting is "how many do we
   start, and when" — which a wall of bars does not answer. This counts
   ground-breaks per month across every group, aligned to the same columns. */
.starts-band {
  display: flex; margin-left: var(--label-w);
  border-bottom: 1px solid var(--border); background: #fbfdff;
}
.starts-cell {
  flex: none; text-align: center; padding: 5px 0 6px; border-left: 1px solid var(--line);
  font-size: 11px; font-weight: 800; color: var(--muted); line-height: 1.15;
}
.starts-cell:first-child { border-left: 0; }
.starts-cell.has { color: var(--ink); background: #eef6ff; }
.starts-cell .n { display: block; font-size: 15px; font-weight: 900; color: var(--navy); }
.starts-cell.has.heavy .n { color: #b45309; }
.starts-lbl {
  display: flex; align-items: center; gap: 7px; padding: 6px 12px;
  font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); border-bottom: 1px solid var(--line); background: #fbfdff;
}

.row { display: flex; align-items: center; min-height: var(--row-h); position: relative; z-index: 1; }
.row:hover { background: #f6f9fd; }
.row .label {
  width: var(--label-w); flex: 0 0 var(--label-w);
  padding: 5px 12px 5px 16px; overflow: hidden;
  position: sticky; left: 0; z-index: 3;
  background: inherit;
}
.row:nth-child(even) { background: #fbfcfe; }
.row .label .closes {
  font-size: 10.5px; font-weight: 800; color: #0369a1; letter-spacing: .02em; margin-top: 1px;
}
.row .job { font-size: 12.5px; font-weight: 900; color: var(--navy); line-height: 1.1; }
.row .addr { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .name { font-size: 11px; color: var(--steel); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { position: relative; flex: 1 1 auto; height: 100%; }

.bar {
  position: absolute; top: 50%; transform: translateY(-50%);
  height: 18px; border-radius: 5px;
  display: flex; align-items: center;
  box-shadow: var(--shadow-sm);
  cursor: default;
}
.bar.solds { background: linear-gradient(90deg, #4ade80 0%, var(--green-dk) 100%); }
.bar.model { background: linear-gradient(90deg, #a78bfa 0%, var(--purple-dk) 100%); }
.bar.lead  {
  background: repeating-linear-gradient(135deg, var(--gold) 0 7px, var(--gold-soft) 7px 14px);
  border: 1px dashed var(--amber-dk);
  height: 16px;
}
.bar .pct {
  font-size: 10px; font-weight: 900; color: #fff; padding-left: 7px;
  text-shadow: 0 1px 1px rgba(0,0,0,.25); white-space: nowrap;
}
.bar.lead .pct { color: var(--amber-dk); text-shadow: none; }
.bar.escrow { background: linear-gradient(90deg, #38bdf8 0%, #0369a1 100%); }
/* Pre-construction is committed but not dug — solid enough to read as real,
   muted enough not to be mistaken for work in the ground. */
.bar.precon { background: linear-gradient(90deg, #94a3b8 0%, #475569 100%); height: 16px; }
.bar.precon .pct { color: #fff; }
/* Placeholder: outlined rather than filled — intent, not a commitment. */
.bar.placeholder {
  background: repeating-linear-gradient(135deg, rgba(251,146,60,.22) 0 6px, rgba(251,146,60,.07) 6px 12px);
  border: 1px dashed #fb923c; height: 16px;
}
.bar.placeholder .pct { color: #9a3412; text-shadow: none; }
/* Built, not yet closed — shown as a hold over the bar, not as work. */
.bar .hold {
  position: absolute; top: 0; bottom: 0; border-radius: 0 5px 5px 0;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.72) 0 6px, rgba(255,255,255,.3) 6px 12px);
  border-left: 2px solid rgba(255,255,255,.9);
}
/* estimated-end portion (no complete_date) shown lighter */
.bar .est { position: absolute; right: 0; top: 0; bottom: 0; border-radius: 0 5px 5px 0;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 5px, transparent 5px 10px); }

.bar-cap { position: absolute; top: 50%; transform: translate(-50%,-50%);
  font-size: 10px; font-weight: 900; color: var(--navy-dark); white-space: nowrap; }

/* markers */
.today {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--red); z-index: 5; pointer-events: none;
}
.today::after {
  content: 'TODAY'; position: absolute; top: -1px; left: 4px;
  font-size: 9px; font-weight: 900; letter-spacing: 1px; color: var(--red);
  background: var(--white); padding: 1px 4px; border-radius: 3px;
  box-shadow: var(--shadow-sm);
}
.close-mark {
  position: absolute; top: 50%; transform: translate(-50%,-50%) rotate(45deg);
  width: 11px; height: 11px; background: var(--gold);
  border: 1.5px solid var(--amber-dk); z-index: 4;
}
.close-mark::after {
  content: attr(data-d); position: absolute; left: 50%; top: -22px;
  transform: translateX(-50%) rotate(-45deg);
  font-size: 9px; font-weight: 900; color: var(--amber-dk); white-space: nowrap;
}

/* states */
.state { padding: 60px 22px; text-align: center; color: var(--muted); }
.state h3 { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--navy); margin-bottom: 6px; }
.state .err { color: var(--red); font-weight: 700; }
.foot { padding: 12px 22px 0; font-size: 11.5px; color: var(--muted); }
.foot b { color: var(--navy-dark); }

@media (max-width: 640px) {
  :root { --label-w: 150px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body data-vbh-page="gantt" data-vbh-build="gantt-v2">

<div data-vbh-header></div>

<div class="controls">
  <div class="legend">
    <span class="item"><span class="swatch sw-solds"></span>Solds</span>
    <span class="item"><span class="swatch sw-model"></span>Models</span>
    <span class="item"><span class="swatch sw-escrow"></span>Escrow</span>
    <span class="item"><span class="swatch sw-precon"></span>Pre-Construction</span>
    <span class="item"><span class="swatch sw-lead"></span>Prospective</span>
    <span class="item"><span class="swatch sw-ph"></span>Placeholder</span>
  </div>
  <span class="spacer"></span>
  <div class="scale-toggle" id="scaleToggle">
    <button data-px="34">Compact</button>
    <button data-px="54" class="active">Standard</button>
    <button data-px="84">Wide</button>
  </div>
</div>

<div class="wrap">
  <div class="chart-card">
    <div id="content" class="scroller">
      <div class="state"><h3>Loading timeline…</h3><div>Pulling active builds and prospective starts.</div></div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ============================================================
   CONFIG — adjust if your leads table uses different names.
   The projects table is read directly from the tracker schema.
   ============================================================ */
const LEADS_TABLE      = 'leads';
const LEAD_JOB_FIELD   = 'job_number';      // job # on a lead row
const LEAD_START_FIELD = 'start_date';      // prospective start
const LEAD_ADDR_FIELD  = 'tentative_address';
const LEAD_NAME_FIELD  = 'owner1_last';     // homeowner last name on a lead row
const PROJ_NAME_FIELD  = 'buyer_realtor';   // projects store the homeowner in buyer_realtor; we derive the last name from it

const MONTHS_END_FROM_START = 7;            // bar end = start + 7 months when no complete_date

/* A placeholder is a start we intend to make but have no buyer for. Marked by
   the lead's status, which is a real value in VBH.STATUSES so the Leads tab
   filters and colours it like any other. */
function isPlaceholder(l) { return /^placeholder$/i.test(String(l && l.status || '')); }
/* ============================================================ */

const SUPABASE_URL  = VBH.SUPABASE_URL;
const SUPABASE_ANON = VBH.SUPABASE_KEY;

let sb = null;
let PX_PER_MONTH = 54;

// Surface setup problems on screen instead of hanging on "Loading…"
function fail(title, detail, hint) {
  const c = document.getElementById('content');
  if (c) c.innerHTML = `<div class="state"><h3>${title}</h3>`
    + `<div class="err">${detail ? esc(detail) : ''}</div>`
    + (hint ? `<div style="margin-top:8px;max-width:520px;margin-inline:auto;line-height:1.5">${hint}</div>` : '')
    + `</div>`;
}

function initClient() {
  if (!window.supabase || !window.supabase.createClient) {
    fail('Supabase library didn’t load',
      'window.supabase is undefined.',
      'The Supabase CDN script was blocked or failed to load. Check the network tab for <b>@supabase/supabase-js</b>, and confirm the page can reach the CDN.');
    return false;
  }
  if (!SUPABASE_URL || !SUPABASE_ANON) {
    fail('Missing Supabase credentials',
      `URL: ${SUPABASE_URL ? 'ok' : 'undefined'} · key: ${SUPABASE_ANON ? 'ok' : 'undefined'}`,
      'This usually means <b>/vbh-config.js</b> didn’t load — most often because the page was opened from disk rather than served from vbchomes.net. Host it on the hub (or wherever the other tiles live) so <b>/vbh-config.js</b> resolves.');
    return false;
  }
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    return true;
  } catch (e) {
    fail('Couldn’t create Supabase client', e.message || String(e));
    return false;
  }
}

const MS_DAY = 86400000;
const fmtDay = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const parseDate = s => { if (!s) return null; const d = new Date(s + (String(s).length <= 10 ? 'T00:00:00' : '')); return isNaN(d) ? null : d; };
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// The timeline label wants just the surname. buyer_realtor now carries the
// canonical "Martin, David and Patty" (surname before the comma); legacy rows
// may still be freeform "David & Patty Martin" (surname = last token).
// Leads already carry owner1_last, so they skip this.
function lastName(full){
  const s = String(full ?? '').trim();
  if (!s) return '';
  if (s.includes(',')) return s.split(',')[0].trim();
  const parts = s.split(/\s+/);
  return parts[parts.length - 1];
}

// reject if a thenable (Supabase query builder) doesn't settle in time
function withTimeout(thenable, ms, label) {
  return Promise.race([
    Promise.resolve(thenable),
    new Promise((_, rej) => setTimeout(() => rej(new Error(`${label} timed out after ${ms/1000}s — no response from Supabase`)), ms))
  ]);
}

// derive {start, end, estimated, close, pct} for a row
function deriveBar(start, complete, closing, pct) {
  const s = parseDate(start);
  if (!s) return null;
  let end = parseDate(complete);
  let estimated = false;
  if (!end) { end = addMonths(s, MONTHS_END_FROM_START); estimated = true; }
  const close = parseDate(closing);
  /* v3 — a finished house waiting on a closing still occupies the calendar.
     3416 Bronze is built and sold but does not close until 2027-08-01; its
     bar used to stop seven months after the start and read as stale, and the
     closing diamond could land outside the chart entirely, because the date
     range was computed from bar ends and never looked at closings.
     The bar now runs to the closing, with everything after construction
     drawn as a hold rather than as work. */
  let holdFrom = null;
  if (close && close > end) { holdFrom = end; end = close; estimated = false; }
  return { start: s, end, estimated, close, pct, holdFrom };
}

async function load() {
  const content = document.getElementById('content');
  let projects = [], leads = [], leadErr = null, leadsDropped = 0;

  try {
    /* v2: `precon` and `escrow` arrived with migration 028 and were never added
       here, so every pre-construction job was invisible on the Timeline. */
    const r = await withTimeout(
      sb.from('projects').select('*').in('stage', ['precon', 'solds', 'escrow', 'model']),
      15000, 'projects query');
    if (r.error) throw r.error;
    projects = r.data || [];
  } catch (e) {
    fail('Couldn’t load projects', e.message || String(e),
      'If this timed out, the request may be blocked before it reaches Supabase — the same endpoint-security HTTPS interception that hit your laptop before. Try another network or browser to confirm.');
    return;
  }

  // leads are optional — if the table/columns differ, we degrade gracefully
  let leadCols = [];
  try {
    const r = await withTimeout(sb.from(LEADS_TABLE).select('*'), 15000, 'leads query');
    if (r.error) throw r.error;
    const rows = r.data || [];
    if (rows.length) leadCols = Object.keys(rows[0]);

    /* v2 — a prospective start has to be genuinely prospective.
       The old filter was job number + start date and nothing else, so:
         · leads marked Closed - Lost and archived still drew a bar. On
           2026-11-24 that was 33 Riverview Heights and 6209 Mapleton, both
           dead, both sitting in the plan.
         · a lead that had become a real project drew a SECOND bar from its
           old lead start date — 840 Sylvan appeared twice, once as a model
           starting in November and once as a prospect starting in August.
       Both make the start count wrong, which is the number this page exists
       to show. */
    const liveJobs = new Set(projects.map(p => String(p.job_number||'').toUpperCase()).filter(Boolean));
    /* Address is the reliable key across the two tables. Estimate numbers do
       NOT line up with job numbers — ER26027 is not R26027 — so stripping the
       E would merge different houses. But 1008 Bluffside Drive is 1008
       Bluffside Drive in both, and that lead (ER26013) was drawing a second
       bar alongside its own project (R26013). */
    const normAddr = s => String(s||'').toLowerCase()
      .replace(/\b(drive|dr|lane|ln|avenue|ave|court|ct|circle|cir|street|st|road|rd|place|pl)\b\.?/g,'')
      .replace(/[^a-z0-9]/g,'');
    const liveAddrs = new Set(projects.map(p => normAddr(p.address)).filter(a => a.length > 3));
    const isDead = l => l.archived === true || /^closed/i.test(String(l.status||''));
    const alreadyBuilding = l => {
      const jn = String(l[LEAD_JOB_FIELD]||'').toUpperCase();
      if (jn && liveJobs.has(jn)) return true;
      const a = normAddr(l[LEAD_ADDR_FIELD]);
      return a.length > 3 && liveAddrs.has(a);
    };
    /* A prospective start needs a DATE, not a job number. Requiring the job
       number hid every early prospect that hasn't been numbered yet — which
       on 2026-11-24 meant the April 2027 start, the first dig of the year,
       was missing from a chart built to show exactly that. */
    leads = rows.filter(l => l[LEAD_START_FIELD] && !isDead(l) && !alreadyBuilding(l));
    leadsDropped = rows.filter(l => l[LEAD_START_FIELD]
                          && (isDead(l) || alreadyBuilding(l))).length;
  } catch (e) { leadErr = e.message || String(e); }

  const groups = [
    { key: 'solds', title: 'Solds — Under Construction', dot: 'dot-solds', cls: 'solds',
      items: projects.filter(p => p.stage === 'solds').map(p => ({
        job: p.job_number, addr: p.address, name: lastName(p[PROJ_NAME_FIELD]),
        bar: deriveBar(p.start_date, p.complete_date, p.closing_date,
              p.pct_complete != null ? Math.round(p.pct_complete * 100) : null)
      })) },
    { key: 'model', title: 'Models — Show Homes', dot: 'dot-model', cls: 'model',
      items: projects.filter(p => p.stage === 'model').map(p => ({
        job: p.job_number, addr: p.address, name: lastName(p[PROJ_NAME_FIELD]),
        bar: deriveBar(p.start_date, p.complete_date, p.closing_date,
              p.pct_complete != null ? Math.round(p.pct_complete * 100) : null)
      })) },
    { key: 'escrow', title: 'Escrow', dot: 'dot-escrow', cls: 'escrow',
      items: projects.filter(p => p.stage === 'escrow').map(p => ({
        job: p.job_number, addr: p.address, name: lastName(p[PROJ_NAME_FIELD]),
        bar: deriveBar(p.start_date, p.complete_date, p.closing_date,
              p.pct_complete != null ? Math.round(p.pct_complete * 100) : null)
      })) },
    /* Pre-construction: contracted or planned, ground not broken. Shown
       separately from prospects because these are committed — except a
       `design` job, which by definition has no contract yet. That is what
       "prospective" means, so a design-stage job belongs with the prospects
       rather than among the committed starts, and is listed there below. */
    { key: 'precon', title: 'Pre-Construction — Not Yet Started', dot: 'dot-precon', cls: 'precon',
      items: projects.filter(p => p.stage === 'precon' && p.precon_type !== 'design').map(p => ({
        job: p.job_number, addr: p.address, name: lastName(p[PROJ_NAME_FIELD]),
        precon: p.precon_type,
        bar: deriveBar(p.start_date, p.complete_date, p.closing_date, null)
      })) },
    /* Two kinds of "not sold yet", and they mean different things to a sales
       meeting: a prospect is a client in play, a placeholder is a slot we
       intend to build and still need a buyer for. Kept apart so the quota
       question — how many starts are real people versus empty slots — can be
       read off the chart. */
    { key: 'lead', title: 'Prospective Starts — Clients', dot: 'dot-lead', cls: 'lead',
      items: projects.filter(p => p.stage === 'precon' && p.precon_type === 'design').map(p => ({
        job: p.job_number, addr: p.address, name: lastName(p[PROJ_NAME_FIELD]), prob: null,
        bar: deriveBar(p.start_date, p.complete_date, null, null)
      })).concat(leads.filter(l => !isPlaceholder(l)).map(l => ({
        job: l[LEAD_JOB_FIELD], addr: l[LEAD_ADDR_FIELD], name: l[LEAD_NAME_FIELD], prob: l.probability,
        /* A lead's completion_date is an estimated finish, not a closing date.
           Passing it as both put a "Closes 31 Aug" on every prospect and drew
           a closing diamond for a house nobody has sold yet. */
        bar: deriveBar(l[LEAD_START_FIELD], l.completion_date || null, null, null)
      }))) },
    { key: 'placeholder', title: 'Placeholders — Need a Buyer', dot: 'dot-ph', cls: 'placeholder',
      items: leads.filter(isPlaceholder).map(l => ({
        job: l[LEAD_JOB_FIELD], addr: l[LEAD_ADDR_FIELD], name: l[LEAD_NAME_FIELD], prob: l.probability,
        bar: deriveBar(l[LEAD_START_FIELD], l.completion_date || null, null, null)
      })) },
  ].map(g => ({ ...g, items: g.items.filter(i => i.bar).sort((a,b)=> a.bar.start - b.bar.start) }))
   .filter(g => g.items.length);

  const all = groups.flatMap(g => g.items.map(i => i.bar));
  if (!all.length) {
    content.innerHTML = `<div class="state"><h3>No dated builds yet</h3><div>Add a start date to a sold, model, or prospective lead and it’ll appear here.</div></div>`;
    document.getElementById('foot').innerHTML = leadErr ? footNote(leadErr, 0, []) : '';
    return;
  }

  // timeline bounds — pad one month each side, snap to month starts
  const today = new Date(); today.setHours(0,0,0,0);
  let min = new Date(Math.min(...all.map(b => +b.start), +today));
  let max = new Date(Math.max(...all.map(b => +b.end),   +today));
  min = startOfMonth(addMonths(min, -1));
  max = startOfMonth(addMonths(max, 2));
  const totalMonths = monthsBetween(min, max);

  const xOf = d => (monthsBetween(min, d) + (d.getDate() - 1) / 31) * PX_PER_MONTH;

  // month header
  let mh = '';
  for (let i = 0; i < totalMonths; i++) {
    const m = addMonths(min, i);
    mh += `<div class="month" style="width:${PX_PER_MONTH}px">${m.toLocaleDateString('en-US',{month:'short'})}<span class="yr">${m.getFullYear()}</span></div>`;
  }

  // gridlines + alternating month bands
  let grid = '';
  for (let i = 0; i < totalMonths; i++) {
    if (i % 2 === 1) grid += `<div class="band" style="left:${i*PX_PER_MONTH}px;width:${PX_PER_MONTH}px"></div>`;
  }
  for (let i = 0; i <= totalMonths; i++) grid += `<div class="v" style="left:${i*PX_PER_MONTH}px"></div>`;

  // rows
  let rowsHtml = '';
  for (const g of groups) {
    rowsHtml += `<div class="grp-head"><span class="dot ${g.dot}"></span>${esc(g.title)} <span class="cnt">· ${g.items.length}</span></div>`
              + `<div class="months-row">${mh}</div>`;
    for (const it of g.items) {
      const b = it.bar;
      const left = xOf(b.start);
      const width = Math.max(xOf(b.end) - left, 10);
      const estPart = b.estimated ? `<span class="est" style="width:${Math.min(0.5,(MONTHS_END_FROM_START-Math.max(0,monthsBetween(b.start, new Date())))/MONTHS_END_FROM_START)*100||34}%"></span>` : '';
      /* The stretch between "built" and "closes" — held, not worked. */
      const holdPart = b.holdFrom
        ? `<span class="hold" style="left:${Math.max(xOf(b.holdFrom) - left, 0)}px;width:${Math.max(xOf(b.end) - xOf(b.holdFrom), 4)}px" title="Built — awaiting closing ${fmtDay(b.close)}"></span>`
        : '';
      const pctTxt = b.pct != null
        ? `<span class="pct">${b.pct}%</span>`
        : g.cls === 'lead'        ? `<span class="pct">${it.prob ? it.prob+'%' : 'planned'}</span>`
        : g.cls === 'placeholder' ? `<span class="pct">needs a buyer</span>`
        : g.cls === 'precon' ? `<span class="pct">${esc(it.precon === 'sold' ? 'sold' : it.precon === 'spec' ? 'spec' : it.precon === 'design' ? 'design' : 'pre-con')}</span>`
        : '';
      const closeMark = b.close
        ? `<span class="close-mark" data-d="${fmtDay(b.close)}" style="left:${xOf(b.close)}px" title="Closing ${fmtDay(b.close)}"></span>` : '';
      const tip = `${it.job||''} · ${fmtDay(b.start)} → ${fmtDay(b.holdFrom || b.end)}${b.estimated?' (est.)':''}`
                + (b.close ? ` · closes ${fmtDay(b.close)}` : '');
      rowsHtml += `
        <div class="row">
          <div class="label">
            <div class="job">${esc(it.job || '—')}</div>
            ${it.addr ? `<div class="addr">${esc(it.addr)}</div>` : ''}
            ${it.name ? `<div class="name">${esc(it.name)}</div>` : ''}
            ${(!it.addr && !it.name) ? `<div class="addr">(no address)</div>` : ''}
            ${b.close ? `<div class="closes">Closes ${esc(fmtDay(b.close))}</div>` : ''}
          </div>
          <div class="track">
            <div class="bar ${g.cls}" style="left:${left}px;width:${width}px" title="${esc(tip)}">${pctTxt}${estPart}${holdPart}</div>
            ${closeMark}
          </div>
        </div>`;
    }
  }

  const trackW = totalMonths * PX_PER_MONTH;
  const todayLeft = xOf(today);

  /* Ground-breaks per month, every group counted together — the number the
     spec meeting actually asks for. Committed work (building, escrow,
     pre-construction) is separated from prospects so the band shows what is
     locked in versus what still has to be sold. */
  const startsByMonth = new Array(totalMonths).fill(null).map(() => ({ firm: 0, prospect: 0, ph: 0 }));
  for (const g of groups) {
    for (const it of g.items) {
      const i = monthsBetween(min, startOfMonth(it.bar.start));
      if (i < 0 || i >= totalMonths) continue;
      if      (g.key === 'placeholder') startsByMonth[i].ph++;
      else if (g.key === 'lead')        startsByMonth[i].prospect++;
      else                              startsByMonth[i].firm++;
    }
  }
  const startsBand = startsByMonth.map(c => {
    const total = c.firm + c.prospect + c.ph;
    const cls = total ? ' has' + (total >= 3 ? ' heavy' : '') : '';
    /* The big number is the total; this line only says what it is made of, so
       it must not repeat the count. Firm is the one worth naming outright —
       the rest still has to be sold. */
    const parts = [];
    if (c.firm)     parts.push(`${c.firm} firm`);
    if (c.prospect) parts.push(`${c.prospect}p`);
    if (c.ph)       parts.push(`${c.ph}h`);
    const label = !total ? '—'
      : (parts.length === 1 && c.firm)     ? 'firm'
      : (parts.length === 1 && c.prospect) ? 'prospective'
      : (parts.length === 1 && c.ph)       ? 'placeholder'
      : parts.join(' · ');
    return `<div class="starts-cell${cls}" style="width:${PX_PER_MONTH}px"
      title="${c.firm} firm, ${c.prospect} prospective, ${c.ph} placeholder"><span class="n">${total || ''}</span>${label}</div>`;
  }).join('');

  const totFirm = startsByMonth.reduce((n,c) => n + c.firm, 0);
  const totProspect = startsByMonth.reduce((n,c) => n + c.prospect, 0);
  const totPh = startsByMonth.reduce((n,c) => n + c.ph, 0);

  content.innerHTML = `
    <div class="gantt" style="--label-w:240px">
      <div class="months">${mh}</div>
      <div class="starts-lbl">Starts per month
        <span style="color:var(--navy);font-weight:900">${totFirm} firm</span>
        <span style="color:var(--muted)">+ ${totProspect} prospective</span>
        <span style="color:#9a3412">+ ${totPh} placeholder</span>
      </div>
      <div class="starts-band">${startsBand}</div>
      <div class="rows" style="min-width:${trackW}px">
        <div class="gridlines">${grid}</div>
        <div class="today" style="left:calc(var(--label-w) + ${todayLeft}px)"></div>
        ${rowsHtml}
      </div>
    </div>`;

  document.getElementById('foot').innerHTML = footNote(leadErr, leads.length, leadCols, leadsDropped);
}

function footNote(leadErr, leadCount, leadCols, leadsDropped) {
  const base = `Bars run from <b>start date</b> to <b>complete date</b>. When no complete date is set, the end is estimated at <b>start + ${MONTHS_END_FROM_START} months</b> (hatched). Diamonds mark closings.`;
  if (leadErr) return base + `<br>Prospective starts not loaded: <b>${esc(leadErr)}</b>. Edit the leads config block at the top of gantt.html.`;
  if (leadCount === 0 && leadCols && leadCols.length) {
    // we read the table but matched nothing — likely wrong column names
    return base + `<br>No prospective starts matched. Your leads table columns are: <b>${esc(leadCols.join(', '))}</b>. `
      + `Set <b>LEAD_JOB_FIELD</b> / <b>LEAD_START_FIELD</b> in the config block to the right names.`;
  }
  return base + ` Showing <b>${leadCount}</b> prospective start${leadCount===1?'':'s'}.`
    + (leadsDropped ? ` <b>${leadsDropped}</b> lead${leadsDropped===1?'':'s'} with a start date ${leadsDropped===1?'was':'were'} left off — already building, lost, or archived.` : '');
}

document.getElementById('scaleToggle').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  document.querySelectorAll('#scaleToggle button').forEach(b => b.classList.toggle('active', b === btn));
  PX_PER_MONTH = +btn.dataset.px;
  if (sb) load();
});

/* v3 — live, not a snapshot. The Timeline is read-only: it owns no data, it
   just draws `projects` and `leads`. So it re-reads them on a timer and
   whenever the tab is brought back, which is what makes a stage change or a
   new start date on the Projects or Leads tab appear here without anyone
   rebuilding anything. Paused while the tab is hidden so a screen left open
   on a meeting room TV isn't polling all day. */
const REFRESH_MS = 60000;
let refreshTimer = null;

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => { if (!document.hidden && sb) load(); }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && sb) load(); });
}

function boot() { if (initClient()) { load(); startAutoRefresh(); } }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
<div data-vbh-foot></div>
</body>
</html>
